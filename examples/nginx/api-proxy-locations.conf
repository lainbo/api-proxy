# 将本文件安装到 /etc/nginx/snippets/api-proxy-locations.conf，或改成你自己的 include 路径。

proxy_connect_timeout 10s;
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
# 默认 1m，AI 请求体（工具定义/图片/文件）很容易超
client_max_body_size 100m;

proxy_buffer_size 64k;
proxy_buffers 4 64k;
proxy_busy_buffers_size 128k;
proxy_headers_hash_max_size 2048;
proxy_headers_hash_bucket_size 128;

proxy_buffering off;
proxy_request_buffering off;
gzip off;

# 请求行包含路径中的 Telegram Bot Token、Discord Webhook Token 和查询参数中的 Gemini key
access_log off;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;

location ~* \.(php|asp|aspx|jsp|cgi|pl|py|sh|bak|sql|zip|tar|gz|rar|7z)(?:/|$) {
    return 444;
}

location ^~ /.git {
    return 444;
}

location ^~ /.env {
    return 444;
}

location ~* ^/(wp-admin|wp-content|wp-includes|wordpress|xmlrpc\.php|vendor|phpmyadmin|pma)(?:/|$) {
    return 444;
}

location = /health {
    proxy_pass http://127.0.0.1:8000;
}

# API 前缀必须带 ^~：命中后跳过上方扫描正则，
# 避免误伤带扩展名的合法路径（如 Telegram 文件下载 /telegram/file/bot<token>/x.zip）
location ^~ /openai/ {
    proxy_pass http://127.0.0.1:8000;
}

location ^~ /openai-auth/ {
    proxy_pass http://127.0.0.1:8000;
}

