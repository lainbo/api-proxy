    proxy_pass http://127.0.0.1:8000;
}

location ^~ /perplexity/ {
    proxy_pass http://127.0.0.1:8000;
}

location ^~ /xai/ {
    proxy_pass http://127.0.0.1:8000;
}

location ^~ /telegram/ {
