[package]
name = "api-proxy"
version = "0.1.0"
edition = "2021"
description = "Thin path-prefix reverse proxy for AI/API upstreams (Rust port)"

[[bin]]
name = "api-proxy"
path = "src/main.rs"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "native-tokio",
    "http1",
    "http2",
    "ring",
    "tls12",
    "rustls-native-certs",
] }
hyper-util = { version = "0.1", features = [
    "client-legacy",
    "http1",
    "http2",
    "server",
    "service",
    "tokio",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tower-service = "0.3"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
